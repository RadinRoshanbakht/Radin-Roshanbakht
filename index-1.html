<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIN ROSHANBAKHT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{background:#1d1d1d;color:#eee;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.page{position:relative;width:100%;height:100vh;min-height:600px;overflow:hidden;background:#1d1d1d}
.name{position:absolute;top:35px;left:5%;z-index:1;font-weight:900;font-size:clamp(110px,21vw,330px);line-height:.82;letter-spacing:-12px;color:#eee;text-shadow:9px 9px 0 #666,15px 15px 0 #292929;user-select:none;white-space:nowrap}
.surname{position:absolute;top:300px;left:5%;z-index:1;font-weight:900;font-size:clamp(65px,11vw,170px);line-height:.8;letter-spacing:-5px;color:#eee;text-shadow:7px 7px 0 #666,12px 12px 0 #292929;user-select:none;white-space:nowrap}
.portrait{position:absolute;z-index:3;right:-4%;bottom:-8%;width:min(65vw,700px);max-height:92vh;object-fit:contain;object-position:bottom right;filter:grayscale(100%) contrast(1.25) brightness(.92)}
.socials{position:absolute;z-index:10;left:7%;bottom:14%;display:flex;flex-direction:column;gap:22px}
.social{width:64px;height:64px;display:flex;align-items:center;justify-content:center;border:4px solid #eee;border-radius:15px;color:#eee;text-decoration:none;font-size:28px;font-weight:900;background:#252525;transition:.25s ease}
.social:hover{transform:scale(1.12);background:#eee;color:#1d1d1d}
.info{position:absolute;z-index:10;left:7%;bottom:6%;color:#999;font-size:13px;letter-spacing:3px;text-transform:uppercase}
@media(max-width:700px){
.page{min-height:100vh}
.name{top:55px;left:10%;font-size:42vw;letter-spacing:-7px;text-shadow:5px 5px 0 #666,9px 9px 0 #292929}
.surname{top:235px;left:10%;font-size:21vw;letter-spacing:-3px;text-shadow:4px 4px 0 #666,7px 7px 0 #292929}
.portrait{width:100vw;right:-12%;bottom:-3%;max-height:70vh}
.socials{left:8%;bottom:15%;gap:14px}
.social{width:52px;height:52px;border-width:3px;border-radius:12px;font-size:23px}
.info{left:8%;bottom:6%;font-size:9px;letter-spacing:2px}
}
@media(max-width:400px){
.name{top:45px}.surname{top:205px}.portrait{width:108vw;right:-17%}.socials{bottom:13%}.social{width:46px;height:46px;font-size:20px}
}
</style>
</head>
<body>
<main class="page">
<div class="name">RADIN</div>
<div class="surname">ROSHANBAKHT</div>
<img class="portrait" src="radin.jpg" alt="Radin Roshanbakht">
<div class="socials">

</div>
<div class="info">© 2026 · RADIN ROSHANBAKHT</div>
</main>
</body>
</html>
