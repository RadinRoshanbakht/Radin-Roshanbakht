<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000">
  <title>Radin Roshanbakht</title>
  <meta name="description" content="Radin Roshanbakht — social links">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#000;color:#fff}
    body{font-family:Arial,Helvetica,sans-serif}
    .page{
      min-height:100svh;display:flex;align-items:center;justify-content:center;
      padding:28px 18px;overflow:hidden
    }
    .card{
      width:min(100%,430px);display:flex;flex-direction:column;
      align-items:center;text-align:center
    }
    .photo{
      width:154px;height:154px;border-radius:50%;object-fit:cover;
      object-position:center top;border:1px solid rgba(255,255,255,.25);
      box-shadow:0 0 0 8px rgba(255,255,255,.025);
      user-select:none;-webkit-user-drag:none;
      animation:in .8s ease both
    }
    h1{
      margin:24px 0 8px;font-size:27px;font-weight:500;
      letter-spacing:.035em;animation:up .7s .1s ease both
    }
    .bio{
      margin:0 0 25px;font-size:13px;letter-spacing:.12em;
      text-transform:uppercase;opacity:.55;animation:up .7s .2s ease both
    }
    .links{width:100%;display:grid;gap:11px}
    .link{
      height:53px;border:1px solid rgba(255,255,255,.18);
      border-radius:14px;color:#fff;text-decoration:none;
      display:flex;align-items:center;justify-content:center;gap:10px;
      font-size:14px;letter-spacing:.04em;
      background:rgba(255,255,255,.035);
      transition:transform .18s ease,background .18s ease,border-color .18s ease
    }
    .link:hover{transform:translateY(-2px);background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.4)}
    .link svg{width:18px;height:18px;fill:currentColor}
    footer{margin-top:28px;font-size:9px;letter-spacing:.2em;opacity:.25;text-transform:uppercase}
    @keyframes in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:420px){.photo{width:132px;height:132px}h1{font-size:23px}.link{height:50px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>

      <h1>Radin Roshanbakht</h1>

          Instagram

  </main>
</body>
