<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ماشین حساب کسری | Fraction Calculator</title>
<meta name="theme-color" content="#0d0d12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>½</text></svg>">
<style>
  :root{
    --bg-1:#0d0d12;
    --bg-2:#16161d;
    --panel:#1b1b24;
    --panel-2:#22222c;
    --gold:#d4af6a;
    --gold-bright:#f0cf8e;
    --text:#f2ede3;
    --text-dim:#9a97a6;
    --danger:#e0616b;
    --op:#8a7bf0;
    --shadow: 0 20px 60px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(circle at 50% 0%, #1c1c26 0%, var(--bg-1) 60%);
    font-family: 'Segoe UI', Tahoma, 'Vazirmatn', sans-serif;
    color:var(--text);
    overflow:hidden;
  }
  #app{
    max-width:430px;
    margin:0 auto;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:18px 16px 22px;
  }
  .brand{
    text-align:center;
    margin-bottom:10px;
    padding-top:4px;
  }
  .brand h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:2px;
    color:var(--gold);
    margin:0;
    text-transform:uppercase;
  }
  .brand span{
    display:block;
    font-size:11px;
    color:var(--text-dim);
    margin-top:3px;
    letter-spacing:1px;
  }

  .display{
    background: linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 100%);
    border-radius:22px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
    border:1px solid rgba(212,175,106,0.15);
    padding:18px 20px;
    margin-bottom:14px;
    min-height:118px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .history{
    font-size:13px;
    color:var(--text-dim);
    min-height:18px;
    text-align:left;
    direction:ltr;
    overflow-x:auto;
    white-space:nowrap;
  }
  .expression-row{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    direction:ltr;
    flex-wrap:wrap;
    min-height:56px;
  }
  .frac{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    line-height:1;
    font-size:26px;
    font-weight:600;
  }
  .frac .num{ padding:0 6px 3px; }
  .frac .den{ padding:0 6px 2px; border-top:2px solid var(--gold); }
  .whole-part{ font-size:30px; font-weight:600; }
  .op-symbol{ font-size:24px; color:var(--op); font-weight:700; margin:0 2px;}
  .result-row{
    text-align:left;
    direction:ltr;
    font-size:14px;
    color:var(--gold-bright);
    min-height:18px;
    overflow-x:auto;
    white-space:nowrap;
  }

  .quick-toggle{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .quick-toggle button{
    flex:1;
    background:var(--panel);
    border:1px solid rgba(255,255,255,0.06);
    color:var(--text-dim);
    padding:8px 4px;
    border-radius:12px;
    font-size:12px;
    cursor:pointer;
    transition:.15s;
  }
  .quick-toggle button.active{
    color:var(--bg-1);
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    border-color:transparent;
    font-weight:600;
  }

  .keypad{
    flex:1;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:10px;
  }
  button.key{
    border:none;
    border-radius:16px;
    font-size:20px;
    font-weight:500;
    color:var(--text);
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    box-shadow: 0 4px 10px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    cursor:pointer;
    transition: transform .06s ease, box-shadow .06s ease, filter .1s;
    -webkit-user-select:none;
    user-select:none;
  }
  button.key:active{
    transform: scale(0.94);
    filter:brightness(1.15);
  }
  button.key.num{ color:var(--text); }
  button.key.op{
    background: linear-gradient(160deg, #2a2440, #201b34);
    color:var(--op);
    font-weight:700;
  }
  button.key.frac-slash{
    color:var(--gold-bright);
    font-weight:700;
    font-size:22px;
  }
  button.key.func{
    background: linear-gradient(160deg, #262128, #1c181d);
    color:var(--text-dim);
    font-size:15px;
  }
  button.key.equals{
    background: linear-gradient(150deg, var(--gold-bright), var(--gold) 70%);
    color:#20180a;
    font-weight:700;
    grid-row: span 2;
    font-size:24px;
  }
  button.key.clear{ color:var(--danger); }
  button.key.wide{ grid-column: span 2; }
</style>
</head>
<body>
<div id="app">
  <div class="brand">
    <h1>Fractio</h1>
    <span>ماشین حساب کسری</span>
  </div>

  <div class="display">
    <div class="history" id="history"></div>
    <div class="expression-row" id="expressionRow">
      <span class="frac"><span class="num">0</span><span class="den">1</span></span>
    </div>
    <div class="result-row" id="resultRow">&nbsp;</div>
  </div>

  <div class="quick-toggle">
    <button id="modeFrac" class="active">حالت کسری</button>
    <button id="modeMixed">عدد مخلوط</button>
    <button id="modeDecimal">نمایش اعشاری</button>
  </div>

  <div class="keypad">
    <button class="key clear" data-action="ac">AC</button>
    <button class="key func" data-action="back">⌫</button>
    <button class="key frac-slash" data-action="slash">/</button>
    <button class="key op" data-action="div">÷</button>

    <button class="key num" data-action="7">7</button>
    <button class="key num" data-action="8">8</button>
    <button class="key num" data-action="9">9</button>
    <button class="key op" data-action="mul">×</button>

    <button class="key num" data-action="4">4</button>
    <button class="key num" data-action="5">5</button>
    <button class="key num" data-action="6">6</button>
    <button class="key op" data-action="sub">−</button>

    <button class="key num" data-action="1">1</button>
    <button class="key num" data-action="2">2</button>
    <button class="key num" data-action="3">3</button>
    <button class="key op" data-action="add">+</button>

    <button class="key num wide" data-action="0">0</button>
    <button class="key func" data-action="space">فاصله</button>
    <button class="key equals" data-action="eq">=</button>
  </div>
</div>

<script>
/* ---------- Fraction math core ---------- */
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a || 1; }

class Frac {
  constructor(n, d=1){
    if(d===0) throw new Error("division by zero");
    if(d<0){ n=-n; d=-d; }
    const g = gcd(n,d);
    this.n = n/g;
    this.d = d/g;
  }
  add(o){ return new Frac(this.n*o.d + o.n*this.d, this.d*o.d); }
  sub(o){ return new Frac(this.n*o.d - o.n*this.d, this.d*o.d); }
  mul(o){ return new Frac(this.n*o.n, this.d*o.d); }
  div(o){ if(o.n===0) throw new Error("division by zero"); return new Frac(this.n*o.d, this.d*o.n); }
  toDecimal(){ return this.n/this.d; }
  toMixedString(){
    const sign = this.n<0 ? "-" : "";
    const an = Math.abs(this.n);
    const whole = Math.floor(an/this.d);
    const rem = an % this.d;
    if(rem===0) return sign+whole;
    if(whole===0) return sign+rem+"/"+this.d;
    return sign+whole+" "+rem+"/"+this.d;
  }
  toFracString(){
    if(this.d===1) return ""+this.n;
    return this.n+"/"+this.d;
  }
}

/* ---------- App state ---------- */
// tokens: array of {type:'frac', n, d} or {type:'op', op}
let tokens = [];
let currentNum = "";
let currentDen = "";
let editingDen = false;
let lastResult = null;
let displayMode = "frac"; // frac | mixed | decimal

const expressionRow = document.getElementById("expressionRow");
const resultRow = document.getElementById("resultRow");
const historyEl = document.getElementById("history");

function opSymbol(op){
  return {add:"+", sub:"−", mul:"×", div:"÷"}[op];
}

function currentFracValid(){
  return currentNum !== "";
}

function buildCurrentFrac(){
  const n = parseInt(currentNum || "0", 10);
  const d = parseInt(currentDen || "1", 10) || 1;
  return {n, d};
}

function render(){
  expressionRow.innerHTML = "";
  tokens.forEach(t=>{
    if(t.type === "frac"){
      expressionRow.appendChild(fracNode(t.n, t.d));
    } else {
      const s = document.createElement("span");
      s.className = "op-symbol";
      s.textContent = opSymbol(t.op);
      expressionRow.appendChild(s);
    }
  });
  // current entry (uncommitted)
  if(currentNum !== "" || editingDen){
    expressionRow.appendChild(fracNode(currentNum || "0", editingDen ? (currentDen || "") : null, true));
  } else if(tokens.length === 0){
    expressionRow.appendChild(fracNode("0", "1"));
  }
}

function fracNode(n, d, liveDen){
  if(d === null || d === undefined || d === false){
    const span = document.createElement("span");
    span.className = "whole-part";
    span.textContent = n;
    return span;
  }
  const wrap = document.createElement("span");
  wrap.className = "frac";
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = n === "" ? "0" : n;
  const den = document.createElement("span");
  den.className = "den";
  den.textContent = (d === "" ? "?" : d);
  wrap.appendChild(num);
  wrap.appendChild(den);
  return wrap;
}

function setResult(text, isHistory){
  resultRow.textContent = text || "\u00A0";
}

function formatFrac(f){
  if(displayMode === "decimal"){
    const dec = f.toDecimal();
    return (Number.isInteger(dec) ? dec : dec.toFixed(6).replace(/0+$/,"").replace(/\.$/,""));
  }
  if(displayMode === "mixed"){
    return f.toMixedString();
  }
  return f.toFracString();
}

function resetAll(){
  tokens = [];
  currentNum = "";
  currentDen = "";
  editingDen = false;
  lastResult = null;
  setResult("");
  historyEl.textContent = "";
  render();
}

function pushCurrentAsToken(){
  if(currentNum === "" && !editingDen) return false;
  const {n,d} = buildCurrentFrac();
  tokens.push({type:"frac", n, d});
  currentNum = "";
  currentDen = "";
  editingDen = false;
  return true;
}

function handleDigit(digit){
  if(editingDen){
    if(currentDen.length < 6) currentDen += digit;
  } else {
    if(currentNum.length < 6) currentNum += digit;
  }
  render();
}

function handleSlash(){
  if(!editingDen && currentNum !== ""){
    editingDen = true;
    render();
  }
}

function handleOp(op){
  // commit current entry first
  if(currentNum === "" && !editingDen){
    if(tokens.length && tokens[tokens.length-1].type === "op"){
      tokens[tokens.length-1].op = op; // replace trailing op
      render();
      return;
    }
    if(lastResult && tokens.length===0){
      tokens.push({type:"frac", n:lastResult.n, d:lastResult.d});
    } else {
      return;
    }
  } else {
    pushCurrentAsToken();
  }
  tokens.push({type:"op", op});
  render();
}

function handleBack(){
  if(editingDen){
    if(currentDen.length>0) currentDen = currentDen.slice(0,-1);
    else editingDen = false;
  } else if(currentNum.length>0){
    currentNum = currentNum.slice(0,-1);
  } else if(tokens.length>0){
    const last = tokens.pop();
    if(last.type === "frac"){
      currentNum = last.n === 0 ? "" : String(last.n);
      if(last.d !== 1){
        currentDen = String(last.d);
        editingDen = true;
      }
    }
  }
  render();
}

function evaluate(){
  pushCurrentAsToken();
  if(tokens.length === 0) return;
  // remove trailing operator if any
  if(tokens[tokens.length-1].type === "op") tokens.pop();
  if(tokens.length === 0) return;

  try{
    // Precedence: * and / before + and -
    // First pass: mul/div
    let pass1 = [];
    let i=0;
    let acc = toFrac(tokens[0]);
    i=1;
    while(i < tokens.length){
      const opTok = tokens[i];
      const nextFrac = toFrac(tokens[i+1]);
      if(opTok.op === "mul") { acc = acc.mul(nextFrac); i+=2; }
      else if(opTok.op === "div") { acc = acc.div(nextFrac); i+=2; }
      else { pass1.push({frac:acc}); pass1.push({op:opTok.op}); acc = nextFrac; i+=2; }
    }
    pass1.push({frac:acc});

    // Second pass: add/sub left to right
    let result = pass1[0].frac;
    for(let j=1;j<pass1.length;j+=2){
      const op = pass1[j].op;
      const nextFrac = pass1[j+1].frac;
      if(op === "add") result = result.add(nextFrac);
      else if(op === "sub") result = result.sub(nextFrac);
    }

    // build history string
    const historyStr = tokens.map(t=>{
      if(t.type==="frac") return t.d===1 ? String(t.n) : (t.n+"/"+t.d);
      return opSymbol(t.op);
    }).join(" ") + " =";
    historyEl.textContent = historyStr;

    lastResult = result;
    tokens = [{type:"frac", n:result.n, d:result.d}];
    currentNum = ""; currentDen=""; editingDen=false;
    setResult(formatFrac(result) + (displayMode!=="decimal" && !Number.isInteger(result.toDecimal()) ? "  ≈ " + result.toDecimal().toFixed(4) : ""));
    render();
  } catch(e){
    setResult("خطا: تقسیم بر صفر");
    tokens = [];
    currentNum=""; currentDen=""; editingDen=false;
    render();
  }
}

function toFrac(tok){
  return new Frac(tok.n, tok.d);
}

/* ---------- Events ---------- */
document.querySelectorAll(".key").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const a = btn.dataset.action;
    if(!isNaN(parseInt(a,10)) && a.length===1 && "0123456789".includes(a)){
      handleDigit(a);
    } else {
      switch(a){
        case "ac": resetAll(); break;
        case "back": handleBack(); break;
        case "slash": handleSlash(); break;
        case "add": handleOp("add"); break;
        case "sub": handleOp("sub"); break;
        case "mul": handleOp("mul"); break;
        case "div": handleOp("div"); break;
        case "eq": evaluate(); break;
        case "space": pushCurrentAsToken(); render(); break;
      }
    }
  });
});

document.getElementById("modeFrac").addEventListener("click", ()=>setMode("frac"));
document.getElementById("modeMixed").addEventListener("click", ()=>setMode("mixed"));
document.getElementById("modeDecimal").addEventListener("click", ()=>setMode("decimal"));

function setMode(m){
  displayMode = m;
  document.querySelectorAll(".quick-toggle button").forEach(b=>b.classList.remove("active"));
  document.getElementById(m==="frac"?"modeFrac":m==="mixed"?"modeMixed":"modeDecimal").classList.add("active");
  if(lastResult){
    setResult(formatFrac(lastResult) + (displayMode!=="decimal" && !Number.isInteger(lastResult.toDecimal()) ? "  ≈ " + lastResult.toDecimal().toFixed(4) : ""));
  }
}

/* keyboard support */
window.addEventListener("keydown", (e)=>{
  if(/[0-9]/.test(e.key)) handleDigit(e.key);
  else if(e.key === "/") handleSlash();
  else if(e.key === "+") handleOp("add");
  else if(e.key === "-") handleOp("sub");
  else if(e.key === "*") handleOp("mul");
  else if(e.key === "Enter" || e.key === "=") evaluate();
  else if(e.key === "Backspace") handleBack();
  else if(e.key === "Escape") resetAll();
});

render();

/* ---------- PWA install support (works when hosted, e.g. on GitHub Pages) ---------- */
if('serviceWorker' in navigator){
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {});
  `;
  try{
    const blob = new Blob([swCode], {type:'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }catch(err){}
}
</script>
</body>
</html>
